[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Long-cache the fingerprinted bundles Vite emits.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    # Every directive needs the "=()" form. It used to end in "interest-cohort()",
    # which failed the structured-header parse and took the whole policy down with
    # it — camera, microphone and geolocation were not actually being denied.
    # interest-cohort is also dead; browsing-topics is what replaced it.
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), browsing-topics=()"
    # 'unsafe-inline' covers the style= attributes React renders and the
    # stylesheet the build inlines; the app's own JS is an external module, so
    # scripts stay locked to 'self'. Fonts are self-hosted, so nothing here
    # needs a third-party origin.
    Content-Security-Policy = "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; img-src 'self' data:; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; connect-src 'self'; form-action 'none'"

# Retire the Netlify subdomain: it stays live as a deploy target, so force a
# 301 to the real domain. Must precede the catch-all below, which matches all.
[[redirects]]
  from = "https://maheshwaran325-portfolio.netlify.app/*"
  to = "https://maheshwaran.dev/:splat"
  status = 301
  force = true

# Every route is emitted as a real HTML file at build time, and Netlify serves
# static files before consulting these rules — so this catches only genuinely
# unknown URLs, and answers them with a real 404 rather than the homepage.
[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404
