[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Long-cache the fingerprinted bundles Vite emits.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Client-side routes fall back to the app shell. Netlify tries static files
# first, so /og.png and the resume PDF are unaffected.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
